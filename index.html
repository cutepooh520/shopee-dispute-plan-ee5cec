<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>案件作戰計畫書</title>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-dark: #1e293b;
      --border-dark: #334155;
      --accent: #e11d48;
      --accent-hover: #be123c;
      --bg-light: #f1f5f9;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #475569;
      --border-light: #cbd5e1;
      --ok: #059669;
      --warn-bg: #fef2f2;
      --warn-border: #fecdd3;
      --warn-text: #9f1239;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      font-size: 16px;
      line-height: 1.65;
      color: var(--text-main);
      background: var(--bg-light);
      -webkit-font-smoothing: antialiased;
    }

    /* Lock Screen */
    #lock-screen[hidden] { display: none; }

    #lock-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: radial-gradient(circle at top, #1e293b 0%, var(--bg-dark) 70%);
      color: #f8fafc;
    }

    .lock-card {
      width: 100%;
      max-width: 400px;
      background: var(--card-dark);
      border: 1px solid var(--border-dark);
      border-radius: 16px;
      padding: 28px 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
    }

    .lock-badge {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: #fda4af;
      background: rgba(225, 29, 72, 0.16);
      border: 1px solid rgba(244, 63, 94, 0.35);
      padding: 4px 10px;
      border-radius: 999px;
      margin-bottom: 12px;
    }

    .lock-title {
      margin: 0 0 6px;
      font-size: 22px;
      font-weight: 700;
      color: #ffffff;
    }

    .lock-desc {
      margin: 0 0 20px;
      font-size: 14px;
      color: #94a3b8;
    }

    .pw-group {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }

    .pw-input {
      flex: 1;
      min-height: 46px;
      padding: 10px 14px;
      font-size: 18px;
      letter-spacing: 0.15em;
      color: #ffffff;
      background: #0f172a;
      border: 1px solid #475569;
      border-radius: 10px;
      outline: none;
    }

    .pw-input:focus {
      border-color: #f43f5e;
      box-shadow: 0 0 0 3px rgba(244, 63, 94, 0.25);
    }

    .btn-toggle-pw {
      min-width: 64px;
      min-height: 46px;
      background: #334155;
      color: #e2e8f0;
      border: 1px solid #475569;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-unlock {
      width: 100%;
      min-height: 48px;
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-unlock:hover { background: var(--accent-hover); }
    .btn-unlock:disabled { opacity: 0.6; cursor: wait; }

    #lock-error {
      min-height: 22px;
      margin: 12px 0 0;
      font-size: 14px;
      font-weight: 600;
      color: #fda4af;
      display: none;
    }

    #lock-error.visible { display: block; }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .shake { animation: shake 0.32s ease; }

    /* Unlocked App */
    #app-root[hidden] { display: none; }

    .top-bar {
      position: sticky;
      top: 0;
      z-index: 30;
      background: var(--bg-dark);
      color: #ffffff;
      border-bottom: 1px solid #1e293b;
      padding: 12px 16px;
    }

    .top-bar-inner {
      max-width: 920px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .brand-group { display: flex; flex-direction: column; gap: 4px; }

    .badge-live {
      align-self: flex-start;
      font-size: 12px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
    }

    .page-title {
      margin: 0;
      font-size: 18px;
      line-height: 1.3;
      font-weight: 700;
    }

    .btn-relock {
      min-height: 44px;
      padding: 8px 14px;
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
    }

    .btn-relock:hover { background: #334155; }

    .container {
      max-width: 920px;
      margin: 0 auto;
      padding: 16px 14px 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border-light);
      border-radius: 14px;
      padding: 18px 16px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.04);
    }

    .card-header-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 10px;
    }

    .section-heading {
      margin: 0 0 10px;
      font-size: 19px;
      font-weight: 800;
      color: var(--text-main);
    }

    .card-header-row .section-heading { margin-bottom: 0; }

    .sub-heading {
      margin: 18px 0 10px;
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
    }

    .section-sub {
      margin: 0 0 14px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .deadline-pill {
      font-size: 13px;
      font-weight: 700;
      background: #fff1f2;
      color: var(--accent);
      border: 1px solid #fecdd3;
      padding: 4px 10px;
      border-radius: 999px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      margin-top: 8px;
    }

    @media (min-width: 680px) {
      .meta-grid { grid-template-columns: 1fr 1fr; }
      .meta-full { grid-column: 1 / -1; }
      .page-title { font-size: 20px; }
    }

    .meta-item {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .meta-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .meta-value { font-size: 15px; font-weight: 500; }

    .meta-value-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .mono-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 15px;
      font-weight: 700;
      background: #e2e8f0;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .btn-mini-copy {
      min-height: 36px;
      padding: 4px 10px;
      font-size: 13px;
      font-weight: 700;
      background: #0f172a;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .tag-warn, .tag-pro {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 6px;
      margin: 2px 4px 2px 0;
    }

    .tag-warn { background: #fef3c7; color: #92400e; }
    .tag-pro { background: #dcfce7; color: #166534; }

    /* Progress & Case ID */
    .progress-panel {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #e2e8f0;
    }

    .progress-head {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 14px;
      margin-bottom: 6px;
    }

    .progress-hint { font-size: 13px; color: var(--text-muted); }

    .progress-track {
      height: 10px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #e11d48, #10b981);
      transition: width 0.2s ease;
    }

    .case-id-row {
      margin-top: 12px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .case-id-label { font-size: 14px; font-weight: 700; }

    .case-id-input {
      flex: 1;
      min-width: 220px;
      min-height: 44px;
      padding: 8px 12px;
      font-size: 15px;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      background: #f8fafc;
    }

    /* Alert Banner */
    .alert-banner {
      background: var(--warn-bg);
      border: 2px solid #fb7185;
      border-radius: 14px;
      padding: 16px;
      color: var(--warn-text);
    }

    .alert-title {
      font-size: 17px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .alert-list {
      margin: 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 15px;
    }

    /* Checklist */
    .checklist-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .check-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 12px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      cursor: pointer;
    }

    .check-item input[type="checkbox"] {
      width: 22px;
      height: 22px;
      margin-top: 2px;
      flex-shrink: 0;
      accent-color: var(--ok);
      cursor: pointer;
    }

    .check-body { display: flex; flex-direction: column; gap: 4px; flex: 1; }

    .check-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      font-size: 16px;
    }

    .time-pill {
      font-size: 13px;
      font-weight: 700;
      background: #e0f2fe;
      color: #0369a1;
      padding: 2px 8px;
      border-radius: 999px;
    }

    .check-desc {
      font-size: 15px;
      color: #334155;
    }

    .check-item:has(input:checked) {
      background: #f0fdf4;
      border-color: #86efac;
    }

    .check-item:has(input:checked) .check-top strong {
      text-decoration: line-through;
      color: #166534;
    }

    /* Table */
    .table-wrap { overflow-x: auto; }

    .strategy-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    .strategy-table th, .strategy-table td {
      text-align: left;
      padding: 10px 12px;
      border-bottom: 1px solid #e2e8f0;
      vertical-align: top;
    }

    .strategy-table th {
      background: #f8fafc;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .pill-merge, .pill-split {
      display: inline-block;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .pill-merge { background: #ede9fe; color: #5b21b6; }
    .pill-split { background: #ffedd5; color: #9a3412; }

    .violation-list, .guide-list {
      margin: 0;
      padding-left: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      font-size: 15px;
    }

    /* Scripts */
    .script-card {
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      background: #f8fafc;
    }

    .script-card:last-child { margin-bottom: 0; }

    .script-head {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .script-head h3 {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
    }

    .script-target {
      display: block;
      font-size: 13px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-copy {
      min-height: 44px;
      padding: 8px 16px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-copy:hover { background: var(--accent-hover); }

    .script-box {
      margin: 0;
      padding: 12px;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: inherit;
      font-size: 14.5px;
      line-height: 1.6;
      color: #0f172a;
    }

    /* Tabs */
    .tabs-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }

    .tab-btn {
      min-height: 44px;
      padding: 8px 14px;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .tab-btn.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
    }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* Toast */
    #toast {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.2s ease;
      z-index: 60;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

  <script>
    (function () {
      const SESSION_KEY = "shopee_plan_key_v1";
      const CHECK_PREFIX = "shopee_plan_chk_";
      const CASE_ID_KEY = "shopee_plan_case_id_v1";

      const lockScreen = document.getElementById("lock-screen");
      const lockCard = document.getElementById("lock-card");
      const appRoot = document.getElementById("app-root");
      const unlockForm = document.getElementById("unlock-form");
      const pwInput = document.getElementById("pw-input");
      const togglePwBtn = document.getElementById("toggle-pw-btn");
      const unlockBtn = document.getElementById("unlock-btn");
      const lockError = document.getElementById("lock-error");
      const toastEl = document.getElementById("toast");

      let toastTimer = null;

      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastEl.classList.remove("show"), 2000);
      }

      function b64ToBytes(b64) {
        const bin = atob(b64);
        const bytes = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) {
          bytes[i] = bin.charCodeAt(i);
        }
        return bytes;
      }

      async function decryptPayload(password) {
        const payload = window.__ENCRYPTED_PAYLOAD__;
        const enc = new TextEncoder();
        const dec = new TextDecoder();
        const salt = b64ToBytes(payload.salt);
        const iv = b64ToBytes(payload.iv);
        const ct = b64ToBytes(payload.ct);

        const baseKey = await crypto.subtle.importKey(
          "raw",
          enc.encode(password),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );

        const aesKey = await crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt,
            iterations: payload.iter,
            hash: "SHA-256"
          },
          baseKey,
          { name: "AES-GCM", length: 256 },
          false,
          ["decrypt"]
        );

        const plainBuffer = await crypto.subtle.decrypt(
          { name: "AES-GCM", iv },
          aesKey,
          ct
        );

        return dec.decode(plainBuffer);
      }

      function showError() {
        lockError.classList.add("visible");
        lockCard.classList.remove("shake");
        void lockCard.offsetWidth;
        lockCard.classList.add("shake");
      }

      function fallbackCopy(text) {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
      }

      async function copyText(text) {
        try {
          if (navigator.clipboard && navigator.clipboard.writeText) {
            await navigator.clipboard.writeText(text);
          } else {
            fallbackCopy(text);
          }
          showToast("已複製到剪貼簿");
        } catch {
          fallbackCopy(text);
          showToast("已複製到剪貼簿");
        }
      }

      function initUnlockedUI() {
        const checkboxes = Array.from(appRoot.querySelectorAll(".track-check"));
        const progressText = appRoot.querySelector("#progress-text");
        const progressFill = appRoot.querySelector("#progress-fill");
        const progressTrack = appRoot.querySelector(".progress-track");

        function updateProgress() {
          const total = checkboxes.length;
          const done = checkboxes.filter((c) => c.checked).length;
          const pct = total ? Math.round((done / total) * 100) : 0;
          if (progressText) progressText.textContent = pct + "% (" + done + "/" + total + ")";
          if (progressFill) progressFill.style.width = pct + "%";
          if (progressTrack) progressTrack.setAttribute("aria-valuenow", String(pct));
        }

        checkboxes.forEach((cb) => {
          const key = CHECK_PREFIX + cb.dataset.checkId;
          try {
            const saved = localStorage.getItem(key);
            if (saved !== null) {
              cb.checked = saved === "1";
            }
          } catch {}
          cb.addEventListener("change", () => {
            try {
              localStorage.setItem(key, cb.checked ? "1" : "0");
            } catch {}
            updateProgress();
          });
        });
        updateProgress();

        const caseInput = appRoot.querySelector("#case-id-input");
        if (caseInput) {
          try {
            const savedCaseId = localStorage.getItem(CASE_ID_KEY);
            if (savedCaseId) {
              caseInput.value = savedCaseId;
            }
          } catch {}
          caseInput.addEventListener("input", () => {
            try {
              localStorage.setItem(CASE_ID_KEY, caseInput.value);
            } catch {}
          });
        }

        appRoot.querySelectorAll("[data-copy-target]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const target = appRoot.querySelector("#" + btn.dataset.copyTarget);
            if (target) copyText(target.textContent.trim());
          });
        });

        appRoot.querySelectorAll("[data-copy-text]").forEach((btn) => {
          btn.addEventListener("click", () => {
            copyText(btn.dataset.copyText || "");
          });
        });

        const tabBtns = Array.from(appRoot.querySelectorAll(".tab-btn"));
        const tabPanels = Array.from(appRoot.querySelectorAll(".tab-panel"));
        tabBtns.forEach((btn) => {
          btn.addEventListener("click", () => {
            const targetId = btn.dataset.tab;
            tabBtns.forEach((b) => {
              const active = b === btn;
              b.classList.toggle("active", active);
              b.setAttribute("aria-selected", active ? "true" : "false");
            });
            tabPanels.forEach((p) => {
              p.classList.toggle("active", p.id === targetId);
            });
          });
        });

        const relockBtn = appRoot.querySelector("#relock-btn");
        if (relockBtn) {
          relockBtn.addEventListener("click", () => {
            try { sessionStorage.removeItem(SESSION_KEY); } catch {}
            appRoot.innerHTML = "";
            appRoot.hidden = true;
            pwInput.value = "";
            lockError.classList.remove("visible");
            lockScreen.hidden = false;
            pwInput.focus();
          });
        }
      }

      async function tryUnlock(password, persist) {
        unlockBtn.disabled = true;
        lockError.classList.remove("visible");
        try {
          const html = await decryptPayload(password);
          if (persist) {
            try { sessionStorage.setItem(SESSION_KEY, password); } catch {}
          }
          appRoot.innerHTML = html;
          lockScreen.hidden = true;
          appRoot.hidden = false;
          initUnlockedUI();
          window.scrollTo(0, 0);
          return true;
        } catch {
          showError();
          return false;
        } finally {
          unlockBtn.disabled = false;
        }
      }

      togglePwBtn.addEventListener("click", () => {
        const isPw = pwInput.type === "password";
        pwInput.type = isPw ? "text" : "password";
        togglePwBtn.textContent = isPw ? "隱藏" : "顯示";
      });

      unlockForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const val = pwInput.value.trim();
        if (!val) {
          showError();
          return;
        }
        tryUnlock(val, true);
      });

      try {
        const saved = sessionStorage.getItem(SESSION_KEY);
        if (saved) {
          tryUnlock(saved, false);
        }
      } catch {}
    })();
  </script>
